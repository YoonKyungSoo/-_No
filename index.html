<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연차 신청 챌린지</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main class="wrap">

    <!-- 0. 인트로 -->
    <section id="intro" class="scene active">
      <h1>연차 쓰고 싶으세요?</h1>
      <p class="big">사용할 수 있으면 해보시지..</p>
      <button id="startBtn" class="btn">도전하기</button>
    </section>

    <!-- 1. 사무실 -->
    <section id="office" class="scene">
      <div class="room">
        <div class="window"></div>
        <div class="desk">
          <span class="desk-laptop">💻</span>
          <span class="desk-cup">☕</span>
        </div>
        <button id="chair" class="dodgy chair" aria-label="의자">🪑</button>
        <div class="floor"></div>
      </div>
    </section>

    <!-- 2. 노트북 -->
    <section id="laptop" class="scene">
      <div class="laptop">
        <div class="screen" id="screen">

          <div class="view off active" id="vOff">
            <button id="power" class="dodgy power" aria-label="전원">⏻</button>
          </div>

          <div class="view boot" id="vBoot">
            <div class="spinner"></div>
            <p>시작하는 중...</p>
          </div>

          <div class="view desktop" id="vDesk">
            <div class="wallpaper" id="wallpaper"></div>
            <p class="sun-text" id="sunText">뭘 그렇게 멍때리면서 봐?ㅋ</p>
            <div class="icons" id="icons">
              <button class="icon wrong">🗑️<span>휴지통</span></button>
              <button class="icon wrong">🖥️<span>내 PC</span></button>
              <button class="icon wrong">📁<span>새 폴더 (3)</span></button>
              <button class="icon wrong">📄<span>퇴사각.txt</span></button>
            </div>
            <button id="gwIcon" class="icon dodgy gw-icon">🏢<span>사내 그룹웨어</span></button>
            <div class="taskbar"><span>⊞</span><span id="clock"></span></div>
          </div>

          <div class="view app" id="vGw">
            <div class="app-bar">🏢 사내 그룹웨어</div>
            <div class="app-body">
              <nav class="menu">
                <button class="wrong">공지사항</button>
                <button class="wrong">전자결재</button>
                <button class="wrong">메일</button>
                <button id="leaveMenu">연차 신청</button>
                <button class="wrong">주간보고</button>
              </nav>
              <div class="content">
                <h3>📢 공지사항</h3>
                <ul>
                  <li>[필독] 연말 연차 사용 자제 요청</li>
                  <li>[인사] 연차는 마음의 양식입니다</li>
                  <li>[총무] 의자 도난 주의 (자꾸 도망감)</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="view app" id="vForm">
            <div class="app-bar">🏢 사내 그룹웨어 › 연차 신청</div>
            <div class="form">
              <label>신청자
                <input id="who" type="text" placeholder="이름 입력" autocomplete="off">
                <span class="warn" id="whoWarn"></span>
              </label>
              <label>날짜
                <input id="date" type="date">
              </label>
              <label>사유
                <select id="why">
                  <option>개인 사유</option>
                  <option>가족 여행</option>
                  <option>병원 방문</option>
                  <option>그냥 쉬고 싶음</option>
                </select>
              </label>
            </div>
            <button id="submitBtn" class="dodgy submit">신청</button>
          </div>

          <div class="view loading" id="vLoad">
            <p id="loadMsg">신청 중입니다...</p>
            <div class="bar"><div id="barFill"></div></div>
            <p class="pct" id="loadPct">0%</p>
          </div>

        </div>
        <div class="base"></div>
      </div>
    </section>

    <p id="caption" class="caption"></p>
  </main>

  <!-- 결과 -->
  <div class="modal" id="result" hidden>
    <div class="sheet">
      <div class="doc">
        <div class="doc-head">
          <strong>연차 결재 결과</strong>
          <span id="docNo"></span>
        </div>
        <dl>
          <dt>신청자</dt><dd id="rWho"></dd>
          <dt>날짜</dt><dd id="rDate"></dd>
          <dt>사유</dt><dd id="rWhy"></dd>
          <dt>결재자</dt><dd>윤경수</dd>
          <dt id="rReasonLabel">결재 의견</dt><dd id="rReason"></dd>
        </dl>
        <div class="stamp" id="stamp"></div>
        <div class="hand" id="hand"></div>
      </div>
      <p class="wasted" id="wasted">쓸데없이 시간낭비 시간 : <b id="wastedTime">00분 00초</b> ^^</p>
      <button id="retryBtn" class="btn">다시 도전</button>
    </div>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
